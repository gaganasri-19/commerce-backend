spring:
  application:
    name: commerce-backend
  
  datasource:
    url: jdbc:mysql://localhost:3306/commerce_db
    username: root
    password: rootpassword
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
    ddl-auto: update  #Automatically updates the database schema to match the entity definitions.
    show-sql: true  #Enables logging of SQL statements generated by Hibernate.
    properties:
      hibernate:
        format_sql: true #Formats the SQL statements for better readability in the logs.

  sql:
    init:
      mode: never #Disables automatic execution of SQL scripts on startup.

  kafka:
    bootstrap-servers: localhost:9092

  data:
    redis:
      host: redis
      port: 6379
  
jwt:
  secret: your-long-secret-strong-key-characters
  expiration: 3600000 # 1 hour in ms

server:
  port: 8080