spring:
  application:
    name: commerce-backend
  
  datasource:
    url: jdbc:mysql://localhost:3306/commerce_db
    username: root
    password: rootpassword
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  sql:
    init:
      mode: never

  kafka:
    bootstrap-servers: localhost:9092
  
jwt:
  secret: your-long-secret-strong-key-characters
  expiration: 3600000 # 1 hour in ms

server:
  port: 8080